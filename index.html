<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Türkçe Quiz</title>
<meta name="description" content="Інтерактивні квізи з турецької мови · Интерактивные квизы по турецкому языку">
<meta name="theme-color" content="#FAF9F4">
<!-- Картка попереднього перегляду при шерингу лінка (Telegram, WhatsApp, Viber) -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://vikkyodessa.github.io/turkce-quiz/">
<meta property="og:title" content="Türkçe Quiz — вивчай турецьку граючись 🧿">
<meta property="og:description" content="Безкоштовні інтерактивні вправи A1–B1: відмінки, часи, розумний словник, режим на швидкість. Без реєстрації, працює з телефона.">
<meta property="og:image" content="https://vikkyodessa.github.io/turkce-quiz/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     ПУТІВНИК ДЛЯ ГРИ З РОЗМІРАМИ (шукай Ctrl+F за назвою):

     КОЛЬОРИ ВСЬОГО САЙТУ ......... одразу нижче, блок :root
     ШИРИНА ЦЕНТРАЛЬНОЇ КОЛОНКИ ... .wrap { max-width: 680px }
     БІЧНІ ФОТО (розмір/позиція) .. блок .side і .side img
     ПОРІГ ПОЯВИ БІЧНИХ ФОТО ...... @media (min-width: 1400px)
     ВІДСТУП ТЕМ ДО РІВНЯ ФОТО .... #screen-topics padding-top
     ВИСОТА ФОТО-КАРУСЕЛІ (моб.) .. .mobile-strip img
     РОЗМІР КАРТИНКИ У СЛОВНИКУ ... .vmedia
     РОЗМІР ЗАГОЛОВКА H1 .......... .hero h1 font-size
     КНОПКИ ВІДПОВІДЕЙ ............ .opts button padding
     ТАЙМЕР-ЧИП ................... .timer-chip

     ПРАВИЛО БЕЗПЕКИ: міняй одне число за раз,
     тримай робочу копію файла поруч.
     ============================================================ */
  :root {
    --paper: #FAF9F4;        /* фон усього сайту */
    --ink: #1C2333;          /* основний колір тексту */
    --ink-soft: #5A6274;     /* другорядний сірий текст */
    --cobalt: #22418F;       /* головний синій: кнопки, заголовки */
    --cobalt-deep: #16295C;  /* темніший синій для ховерів */
    --turquoise: #17A398;    /* бірюза: акценти, правильні відповіді */
    --turquoise-soft: #E1F4F2; /* світла бірюза: плашки успіху */
    --tulip: #D64545;        /* червоний: помилки */
    --tulip-soft: #FBEAEA;   /* світло-червоні плашки */
    --line: #E4E1D6;         /* колір рамок і розділювачів */
    --radius: 14px;          /* заокруглення карток */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Manrope', sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.65;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  main { flex: 1; }
  /* ШИРИНА ЦЕНТРАЛЬНОЇ КОЛОНКИ: 680px — золото для читання */
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 20px; }

  .topbar-wrap {
    position: sticky; top: 0; z-index: 60;
    background: rgba(250, 249, 244, .78);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding-top: 10px; padding-bottom: 10px;
  }
  .back {
    font-family: 'Manrope', sans-serif;
    font-size: 15px; font-weight: 700;
    background: rgba(34, 65, 143, .08);
    color: var(--cobalt); border: none;
    width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; visibility: hidden; flex: none;
    transition: background .15s;
  }
  .back:hover { background: rgba(34, 65, 143, .16); }
  .back.show { visibility: visible; }
  .brand {
    font-family: 'Unbounded', sans-serif;
    font-size: 15px; font-weight: 700;
    color: var(--ink);
    margin-right: auto;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .brand .tr { color: var(--turquoise); }
  .langs { display: flex; gap: 6px; flex: none; }
  .langs button {
    font-family: 'Manrope', sans-serif;
    font-size: 13px; font-weight: 700;
    background: transparent; color: var(--ink-soft);
    border: 1.5px solid var(--line);
    padding: 5px 12px; border-radius: 100px;
    cursor: pointer; transition: all .15s;
  }
  .langs button.on { background: var(--cobalt); border-color: var(--cobalt); color: #fff; }

  .nazar-strip {
    padding-bottom: 0;
    max-height: 90px;
    transition: max-height .25s ease, opacity .25s ease;
  }
  .nazar-row {
    display: none; gap: 6px; align-items: center;
    padding-bottom: 10px; flex-wrap: wrap;
  }
  .nazar-row.show { display: flex; }
  .nazar {
    display: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; border: 2px solid #C9D3EA;
    position: relative;
    transition: transform .25s, border-color .25s;
  }
  .nazar::after {
    content: ""; position: absolute; inset: 4px; border-radius: 50%;
    background: #C9D3EA; transition: background .25s;
  }
  .nazar.ok { border-color: var(--turquoise); transform: scale(1.2); }
  .nazar.ok::after { background: var(--turquoise); }
  .nazar.bad { border-color: var(--tulip); transform: scale(1.2); }
  .nazar.bad::after { background: var(--tulip); }
  .score-pill {
    font-weight: 700; font-size: 13px;
    background: rgba(34, 65, 143, .08); color: var(--cobalt);
    padding: 4px 12px; border-radius: 100px;
  }
  .quiz-pbar { flex: 1; min-width: 80px; }
  .mini-restart {
    width: 30px; height: 30px; border-radius: 50%;
    border: none;
    background: rgba(34, 65, 143, .08); color: var(--cobalt);
    font-size: 16px; font-weight: 700; line-height: 1;
    cursor: pointer;
    transition: background .15s, transform .15s;
  }
  .mini-restart:hover { background: rgba(34, 65, 143, .16); transform: rotate(-45deg); }
  @media (max-width: 700px) {
    .mini-restart { width: 36px; height: 36px; font-size: 18px; }
  }

  .hero { padding: 36px 0 26px; }
  .hero-grid { display: block; }
  .hero-text { margin-bottom: 24px; }
  .hero-media { position: relative; }
  .hero-media img {
    display: block;
    width: 100%; height: 340px;
    object-fit: cover;
    border-radius: 26px;
    box-shadow: 0 24px 60px rgba(34, 65, 143, .25);
  }
  .hero-media::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: 26px;
    background: linear-gradient(180deg, transparent 55%, rgba(22, 41, 92, .35) 100%);
    pointer-events: none;
  }
  .hero-badge {
    position: absolute; right: 18px; bottom: -16px;
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    font-size: 27px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 50%;
    box-shadow: 0 8px 22px rgba(28, 35, 51, .16);
    transform: rotate(-8deg);
    z-index: 2;
  }
  .hero-media.off { display: none; }
  @media (max-width: 560px) {
    .hero-media img { height: 210px; }
  }
  .eyebrow {
    font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--turquoise); margin-bottom: 10px; font-weight: 700;
  }
  .hero h1 {
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 6vw, 44px);
    line-height: 1.12;
    margin-bottom: 10px;
    background: linear-gradient(92deg, var(--cobalt) 30%, var(--turquoise) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero h1 .tr { color: var(--turquoise); -webkit-text-fill-color: var(--turquoise); }
  .hero .sub { color: var(--ink-soft); font-size: 16px; max-width: 500px; }

  main { padding: 36px 0 24px; }
  .screen { display: none; }
  .screen.active { display: block; }

  .choice-grid { display: grid; gap: 14px; }
  .choice {
    display: block; width: 100%; text-align: left;
    background: #fff; border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px 22px;
    cursor: pointer; font-family: 'Manrope', sans-serif;
    transition: border-color .15s, transform .1s, box-shadow .15s;
  }
  .choice:hover { border-color: var(--cobalt); box-shadow: 0 4px 14px rgba(34,65,143,.08); }
  .choice:active { transform: scale(.985); }
  .choice:focus-visible { outline: 3px solid var(--turquoise); outline-offset: 2px; }
  .choice.disabled { opacity: .55; cursor: default; }
  .choice.disabled:hover { border-color: var(--line); box-shadow: none; }
  .choice .c-title {
    font-family: 'Unbounded', sans-serif; font-size: 18px; font-weight: 700;
    color: var(--cobalt); margin-bottom: 4px;
    display: flex; align-items: center; gap: 10px;
  }
  .choice .c-badge {
    font-family: 'Manrope', sans-serif; font-size: 12px; font-weight: 700;
    background: var(--turquoise-soft); color: #0B6B63;
    padding: 2px 10px; border-radius: 100px;
  }
  .choice .c-badge.soon { background: #F0EEE5; color: var(--ink-soft); }
  .choice .c-desc { font-size: 14px; color: var(--ink-soft); }
  .level-a1 .c-title { color: var(--turquoise); }
  .c-row { display: flex; gap: 14px; align-items: flex-start; }
  .c-icon {
    width: 46px; height: 46px; border-radius: 14px;
    background: var(--turquoise-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex: none;
  }
  .c-main { min-width: 0; }
  .c-check { color: var(--turquoise); }
  .choice.done { border-color: var(--turquoise); }
  .pwrap { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .pbar {
    flex: 1; height: 8px;
    background: #EEECE3; border-radius: 100px; overflow: hidden;
  }
  .pfill {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--turquoise), var(--cobalt));
    border-radius: 100px;
    transition: width .4s ease;
  }
  .plabel {
    font-size: 12px; font-weight: 700; color: var(--ink-soft);
    min-width: 56px; text-align: right; flex: none;
  }

  .page-head { margin-bottom: 20px; }
  .page-eyebrow {
    font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--turquoise); font-weight: 700; margin-bottom: 4px;
  }
  .level-intro { color: var(--ink-soft); font-size: 15px; margin-top: 6px; max-width: 560px; }
  .ph-lv { color: var(--turquoise); }
  .page-head h2 { font-size: 26px; }
  .page-head h2 {
    font-family: 'Unbounded', sans-serif;
    font-size: 23px; font-weight: 700; color: var(--cobalt);
    line-height: 1.25;
  }
  .gram { border-left: 4px solid var(--turquoise); }
  .gram a {
    color: var(--cobalt); font-weight: 700;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .gram-head {
    font-family: 'Unbounded', sans-serif;
    font-size: 15px; font-weight: 700; color: var(--cobalt);
    margin-bottom: 8px;
  }
  .gram-text { font-size: 15px; margin-bottom: 10px; }
  .gram-ex { list-style: none; }
  .gram-ex li {
    font-size: 15px; padding: 4px 0;
    border-top: 1px dashed var(--line);
  }
  .gram-ex li:first-child { border-top: none; }
  .gram-ex b { color: var(--cobalt); }
  .gram-scroll { overflow-x: auto; margin-bottom: 10px; }
  .gram-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    min-width: 480px;
  }
  .gram-table th {
    text-align: left;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-soft);
    padding: 4px 10px 8px 0;
    border-bottom: 2px solid var(--line);
  }
  .gram-table td {
    padding: 8px 10px 8px 0;
    border-bottom: 1px dashed var(--line);
    vertical-align: top;
  }
  .gram-table tr:last-child td { border-bottom: none; }
  .gt-name { font-weight: 700; color: var(--cobalt); white-space: nowrap; }
  .gt-name i { font-weight: 500; font-style: normal; font-size: 12px; color: var(--ink-soft); }
  .gram-table td:nth-child(3) { font-size: 13px; }
  .gt-ex b, .gram-table td:nth-child(2) { font-weight: 700; }
  .gram-note { font-size: 14px; color: var(--ink-soft); margin-bottom: 0; }
  .g-h {
    font-weight: 800; color: var(--cobalt);
    margin: 16px 0 6px; font-size: 15px;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .g-formula {
    display: inline-block;
    background: var(--turquoise-soft); color: #0B6B63;
    font-weight: 700; font-size: 14px;
    padding: 4px 12px; border-radius: 8px;
    margin: 2px 0 8px;
  }
  .g-sent { margin: 5px 0; font-size: 15px; }
  .g-sent b { color: var(--cobalt); }
  .gram .gram-table { margin-top: 6px; }


  .section-head { margin: 36px 0 18px; }
  .section-head:first-child { margin-top: 0; }
  .section-head h2 {
    font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 700;
    color: var(--cobalt); margin-bottom: 4px;
  }
  .section-head p { font-size: 14px; color: var(--ink-soft); }

  .card {
    background: #fff; border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 16px;
  }
  .card .tag {
    display: none; font-size: 13px; color: var(--ink-soft);
    font-weight: 500; margin-bottom: 6px;
  }
  .card .tag.show { display: block; }
  .card .sentence { font-size: 18px; margin-bottom: 16px; }
  .card .sentence .num { color: var(--ink-soft); font-weight: 700; margin-right: 2px; }
  .card .sentence b { color: var(--cobalt); font-weight: 700; }
  .card .sentence b.filled {
    color: #0B6B63; background: var(--turquoise-soft);
    padding: 1px 5px; border-radius: 6px;
    display: inline-block; animation: pop .3s ease;
  }
  @keyframes pop {
    0% { transform: scale(.7); }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .speak {
    font-size: 16px; line-height: 1; padding: 7px 10px;
    border-radius: 100px; border: 1.5px solid var(--line);
    background: #fff; cursor: pointer; vertical-align: middle;
    transition: border-color .15s, transform .1s;
  }
  .speak:hover { border-color: var(--cobalt); }
  .speak:active { transform: scale(.92); }
  .speak:focus-visible { outline: 3px solid var(--turquoise); outline-offset: 2px; }
  .no-tts .speak { display: none; }

  .opts { display: flex; gap: 10px; flex-wrap: wrap; }
  .opts button {
    font-family: 'Manrope', sans-serif; font-size: 16px; font-weight: 700;
    padding: 9px 20px; border-radius: 100px;
    border: 2px solid var(--line); background: #fff; color: var(--ink);
    cursor: pointer; transition: border-color .15s, background .15s, transform .1s;
  }
  .opts button:hover { border-color: var(--cobalt); }
  .opts button:active { transform: scale(.96); }
  .opts button:focus-visible { outline: 3px solid var(--turquoise); outline-offset: 2px; }
  .opts button.ok { background: var(--turquoise-soft); border-color: var(--turquoise); color: #0B6B63; }
  .opts button.bad { background: var(--tulip-soft); border-color: var(--tulip); color: #A32626; }
  .opts button:disabled { cursor: default; }
  .fb { display: none; margin-top: 14px; font-size: 15px; font-weight: 500; }
  .fb.show { display: block; }
  .fb.good { color: #0B6B63; }
  .fb.wrong { color: #A32626; }
  .tr-line { display: none; margin-top: 6px; font-size: 15px; color: var(--ink-soft); }
  .tr-line.show { display: block; }

  .sec-result {
    display: none; text-align: center; padding: 24px;
    background: var(--turquoise-soft); border: 1px solid var(--turquoise);
    border-radius: var(--radius); margin-bottom: 16px;
  }
  .sec-result.show { display: block; }
  .sec-result .sec-score {
    font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 700;
    color: var(--cobalt); margin-bottom: 6px;
  }
  .sec-result .sec-text { color: var(--ink-soft); font-size: 15px; margin-bottom: 16px; }
  .sec-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .topic-divider {
    margin: 40px 0 18px;
    padding-top: 30px;
    border-top: 2px dashed var(--line);
  }
  .topic-divider h2 {
    font-family: 'Unbounded', sans-serif;
    font-size: 22px; font-weight: 700; color: var(--cobalt);
  }
  .next-box { margin-top: 16px; }
  .next-btn { width: 100%; padding: 14px 20px; font-size: 16px; }

  .finish {
    display: none; text-align: center; padding: 32px 24px;
    background: #fff; border: 1px solid var(--line);
    border-radius: var(--radius); margin-bottom: 16px;
  }
  .finish.show { display: block; }
  .finish .big {
    font-family: 'Unbounded', sans-serif; font-size: 30px; font-weight: 700;
    color: var(--cobalt); margin-bottom: 8px;
  }
  .finish p { color: var(--ink-soft); margin-bottom: 20px; }
  .btn-restart {
    font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 700;
    padding: 11px 26px; border-radius: 100px; border: none;
    background: var(--cobalt); color: #fff; cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .btn-restart:hover { background: var(--cobalt-deep); }
  .btn-restart:active { transform: scale(.97); }
  .btn-restart:focus-visible { outline: 3px solid var(--turquoise); outline-offset: 2px; }
  .btn-shuffle {
    font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 700;
    padding: 10px 24px; border-radius: 100px;
    border: 2px solid var(--cobalt); background: transparent; color: var(--cobalt);
    cursor: pointer; transition: background .15s, color .15s, transform .1s;
  }
  .btn-shuffle:hover { background: var(--cobalt); color: #fff; }
  .btn-shuffle:active { transform: scale(.97); }
  .btn-shuffle:focus-visible { outline: 3px solid var(--turquoise); outline-offset: 2px; }
  .finish .btn-shuffle { margin-left: 10px; }
  .shuffle-bar { text-align: center; margin: 8px 0 16px; }

  .vcount { font-size: 13px; color: var(--ink-soft); font-weight: 700; margin-bottom: 10px; }
  /* КАРТИНКА У СЛОВНИКОВІЙ КАРТЦІ */
  .vmedia { height: 200px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .vmedia img { max-height: 200px; max-width: 100%; border-radius: 12px; object-fit: cover; }
  .vemoji { font-size: 104px; line-height: 1; }
  .vword {
    font-family: 'Unbounded', sans-serif; font-size: 26px; font-weight: 700;
    color: var(--cobalt);
  }
  .vtrans { color: var(--ink-soft); font-size: 17px; margin: 4px 0 18px; }
  .vcard { text-align: center; }
  .vhint { font-size: 19px; font-weight: 700; color: var(--ink); margin-bottom: 14px; }
  .vopts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .vopts button { width: 100%; }

  .vnav { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
  .vnav button {
    width: 32px; height: 32px; border-radius: 50%;
    border: 2px solid var(--line); background: #fff;
    font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 13px;
    color: var(--ink-soft); cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .vnav button:hover { border-color: var(--cobalt); }
  .vnav button.seen { border-color: var(--turquoise); color: #0B6B63; }
  .vnav button.cur { background: var(--cobalt); border-color: var(--cobalt); color: #fff; transform: scale(1.1); }

  .timer-chip {
    position: fixed;
    left: 50%; transform: translateX(-50%);
    bottom: 18px; z-index: 90;
    background: var(--cobalt); color: #fff;
    font-family: 'Manrope', sans-serif;
    font-weight: 700; font-size: 17px;
    padding: 11px 26px; border-radius: 100px;
    box-shadow: 0 10px 30px rgba(22, 41, 92, .35);
  }
  .timer-chip.low { background: var(--tulip); animation: chipPulse 1s infinite; }
  @keyframes chipPulse {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.07); }
  }

function loadWords() {
  try { return JSON.parse(localStorage.getItem('tq_words') || '{}'); } catch (e) { return {}; }
}
function saveWords(w) {
  try { localStorage.setItem('tq_words', JSON.stringify(w)); } catch (e) {}
}
function wordScore(w) { const st = loadWords(); return st[w] || 0; }
function wordStatus(w) { const s = wordScore(w); return s >= 3 ? 2 : s >= 1 ? 1 : 0; }
function bumpWord(w, ok) {
  const st = loadWords();
  const cur = st[w] || 0;
  st[w] = ok ? Math.min(cur + 1, 5) : Math.min(cur, 2);
  saveWords(st);
}
function trLower(s) { return s.replace(/İ/g, 'i').replace(/I/g, 'ı').toLowerCase(); }
function bumpWordsIn(text, ok) {
  const low = trLower(text);
  DICT_ALL.forEach(item => {
    if (low.indexOf(trLower(item.w)) !== -1) bumpWord(item.w, ok);
  });
}
function levelKnown(level) {
  const list = DICT[level] || [];
  return { know: list.filter(x => wordStatus(x.w) === 2).length, total: list.length };
}

/* ------------------ стан ------------------ */
let LANG = null;
try { LANG = localStorage.getItem('tq_lang'); } catch (e) {}
/* Поки російська вимкнена — всіх переводимо на українську */
if (LANG === 'ru') LANG = 'uk';
const t = k => I18N[LANG || 'uk'][k];

function loadBest() {
  try { return JSON.parse(localStorage.getItem('tq_best') || '{}'); } catch (e) { return {}; }
}
function saveBest(id, sc) {
  try {
    const b = loadBest();
    if (!(id in b) || sc > b[id]) { b[id] = sc; localStorage.setItem('tq_best', JSON.stringify(b)); }
  } catch (e) {}
}
function topicTotal(tp) { return tp.type === 'vocab' ? tp.words.length : tp.questions.length; }

/* ------------------ озвучка ------------------ */
const ttsOk = 'speechSynthesis' in window;
if (!ttsOk) document.documentElement.classList.add('no-tts');
let lastSpeakBtn = null;
let trVoice = null;
function pickVoice() {
  if (!ttsOk) return;
  const voices = window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('tr'));
  if (!voices.length) { trVoice = null; return; }
  // рейтинг: натуральні онлайн-голоси > Google > локальні > решта
  const rank = v => {
    const n = (v.name || '').toLowerCase();
    if (n.includes('natural')) return 4;
    if (n.includes('google')) return 3;
    if (n.includes('online')) return 2;
    return 1;
  };
  voices.sort((a, b) => rank(b) - rank(a));
  trVoice = voices[0];
}
if (ttsOk) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate) {
  if (!ttsOk) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'tr-TR';
  if (trVoice) u.voice = trVoice;
  u.rate = rate;
  window.speechSynthesis.speak(u);
}

/* ------------------ аналітика ------------------ */
let NOTRACK = false;
try { NOTRACK = localStorage.getItem('tq_notrack') === '1'; } catch (e) {}
if (location.hash === '#notrack') {
  try { localStorage.setItem('tq_notrack', '1'); NOTRACK = true; } catch (e) {}
}
function track(path, isEvent) {
  if (NOTRACK) return;
  if (window.goatcounter && window.goatcounter.count) {
    window.goatcounter.count({ path: path, event: !!isEvent });
  }
}
// встановлення PWA і запуски як застосунку
window.addEventListener('appinstalled', () => track('pwa-install', true));
if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) {
  track('pwa-launch', true);
}

const screens = {
  lang: document.getElementById('screen-lang'),
  home: document.getElementById('screen-home'),
  topics: document.getElementById('screen-topics'),
  dict: document.getElementById('screen-dict'),
  quiz: document.getElementById('screen-quiz')
};
let TRAIN_TOPIC = null;
const backBtn = document.getElementById('backBtn');
const nazarRow = document.getElementById('nazarRow');
let curLevel = 'a1';
let curTopic = null;

function route() {
  if (!LANG) return { s: 'lang' };
  const h = location.hash.slice(1);
  if (h === 'a1' || h === 'a2' || h === 'b1') return { s: 'topics', level: h };
  if (h === 'd-a1' || h === 'd-a2' || h === 'd-b1') return { s: 'dict', level: h.slice(2) };
  if (h === 'q-train' && TRAIN_TOPIC) return { s: 'quiz', topic: TRAIN_TOPIC };
  if (h.indexOf('q-') === 0) {
    const tp = TOPICS.find(x => x.id === h.slice(2));
    if (tp) return { s: 'quiz', topic: tp };
  }
  return { s: 'home' };
}

function countLabel(n) {
  if (LANG === 'ru') return n + ' ' + (n === 1 ? 'тема' : n < 5 ? 'темы' : 'тем');
  return n + ' ' + (n === 1 ? 'тема' : n < 5 ? 'теми' : 'тем');
}

function renderDict(level) {
  const info = levelKnown(level);
  document.getElementById('dictHead').innerHTML =
    '<h2><span class="ph-lv">' + level.toUpperCase() + '</span> · 📖 ' + t('dictTitle') + '</h2>' +
    '<p class="dict-know">' + t('knowLabel') + ' <b>' + info.know + '</b> ' + t('ofLabel') + ' ' + info.total + '</p>';

  const search = document.getElementById('dictSearch');
  search.placeholder = t('searchPh');
  search.value = '';

  const weak = DICT[level].filter(x => wordStatus(x.w) < 2);
  const btn = document.getElementById('trainBtn');
  if (weak.length) {
    btn.disabled = false;
    btn.textContent = t('trainWeak') + ' (' + weak.length + ')';
  } else {
    btn.disabled = true;
    btn.textContent = t('allKnown');
  }
  btn.onclick = () => {
    if (!weak.length) return;
    TRAIN_TOPIC = {
      id: 'train-' + level, level: level, type: 'vocab', dynamic: true,
      backTo: 'd-' + level,
      name: { uk: '🎯 Тренування слабких слів', ru: '🎯 Тренировка слабых слов' },
      words: shuffle(weak).slice(0, 10)
    };
    curTopic = null;
    location.hash = 'q-train';
  };

  const list = document.getElementById('dictList');
  function draw(filter) {
    const f = trLower(filter || '');
    list.innerHTML = '';
    DICT[level].forEach(item => {
      const hay = trLower(item.w + ' ' + item.tr.uk + ' ' + item.tr.ru);
      if (f && hay.indexOf(f) === -1) return;
      const st = wordStatus(item.w);
      const row = document.createElement('div');
      row.className = 'dict-row';
      row.innerHTML =
        '<span class="d-emoji">' + item.e + '</span>' +
        '<span class="d-main"><b>' + item.w + '</b><span class="d-tr">' + (item.tr[LANG] || item.tr.uk) + '</span></span>' +
        '<button class="speak" aria-label="🔊">🔊</button>' +
        '<span class="d-st st' + st + '">' + t(['stNew', 'stLearn', 'stKnow'][st]) + '</span>';
      row.querySelector('.speak').addEventListener('click', () => speak(item.w, 0.9));
      list.appendChild(row);
    });
  }
  draw('');
  search.oninput = () => draw(search.value);

  document.getElementById('dictExHead').innerHTML =
    '<h2>' + t('exTitle') + '</h2><p>' + t('exSub') + '</p>';
  const exGrid = document.getElementById('dictTopics');
  exGrid.innerHTML = '';
  TOPICS.filter(x => x.level === level).forEach(tp => exGrid.appendChild(buildTopicCard(tp)));
}

function renderTopics(level) {
  document.getElementById('topicsHead').innerHTML =
    '<h2><span class="ph-lv">' + level.toUpperCase() + '</span> · ' + t('sub_topics') + '</h2>' +
    '<p class="level-intro">' + t(level + 'desc') + '</p>';
  const grid = document.getElementById('topicGrid');
  grid.innerHTML = '';

  TOPICS.filter(x => x.level === level).forEach(tp => grid.appendChild(buildTopicCard(tp)));
  grid.appendChild(buildDictCard(level));
}

function buildDictCard(level) {
  const info = levelKnown(level);
  const dpct = info.total ? Math.round(info.know / info.total * 100) : 0;
  const dcard = document.createElement('button');
  dcard.className = 'choice dict-card' + (dpct === 100 ? ' done' : '');
  dcard.innerHTML =
    '<span class="c-row">' +
      '<span class="c-icon">📖</span>' +
      '<span class="c-main">' +
        '<span class="c-title">' + t('dictTitle') + ' ' + level.toUpperCase() + (dpct === 100 ? ' <span class="c-check">✓</span>' : '') + '</span>' +
        '<span class="c-desc">' + t('dictDesc') + '</span>' +
      '</span>' +
    '</span>' +
    '<span class="pwrap">' +
      '<span class="pbar"><span class="pfill" style="width:' + dpct + '%"></span></span>' +
      '<span class="plabel">' + t('knowLabel') + ' ' + info.know + ' / ' + info.total + '</span>' +
    '</span>';
  dcard.addEventListener('click', () => { location.hash = 'd-' + level; });
  return dcard;
}

/* Лінійний маршрут: що йде після цієї теми в межах рівня */
function nextAfter(tp) {
  const list = TOPICS.filter(x => x.level === tp.level);
  const i = list.indexOf(tp);
  return i >= 0 ? list[i + 1] || null : null;
}

/* Повний перезапуск теми: чистить стрічку, рендерить заново, підіймає нагору */
function restartTopic(tp) {
  try { history.replaceState(null, '', '#q-' + tp.id); } catch (e) {}
  curTopic = tp;
  quizBuilt = true;
  renderQuiz(false, false, false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function appendNextTopic(nx) {
  try { history.replaceState(null, '', '#q-' + nx.id); } catch (e) {}
  curTopic = nx;
  renderQuiz(false, false, true);
}

/* після завершення теми: граматичні теми продовжують стрічку самі,
   словникові (режим одна-картка-на-екран) пропонуються кнопкою */
function afterTopicDone(container) {
  if (curTopic.dynamic) return;
  const nx = nextAfter(curTopic);
  if (nx && nx.type !== 'vocab') {
    appendNextTopic(nx);
  } else {
    container.appendChild(buildNextBtn(curTopic));
  }
}

function buildNextBtn(tp) {
  const box = document.createElement('div');
  box.className = 'next-box';
  const nx = nextAfter(tp);
  const b = document.createElement('button');
  b.className = 'btn-restart next-btn';
  if (nx) {
    b.innerHTML = '▶ ' + t('nextTopic') + ': ' + (nx.icon || '📘') + ' ' + nx.name[LANG];
    b.addEventListener('click', () => { location.hash = 'q-' + nx.id; });
  } else {
    b.innerHTML = '📖 ' + t('nextDict');
    b.addEventListener('click', () => { location.hash = 'd-' + tp.level; });
  }
  box.appendChild(b);
  return box;
}

function buildTopicCard(tp) {
  const b = document.createElement('button');
  b.className = 'choice';
  const bests = loadBest();
  const tot = topicTotal(tp);
  const best = Math.min(bests[tp.id] || 0, tot);
  const pct = Math.round(best / tot * 100);
  if (pct === 100) b.classList.add('done');
  b.innerHTML =
    '<span class="c-row">' +
      '<span class="c-icon">' + (tp.icon || '📘') + '</span>' +
      '<span class="c-main">' +
        '<span class="c-title">' + tp.name[LANG] + (pct === 100 ? ' <span class="c-check">✓</span>' : '') + '</span>' +
        '<span class="c-desc">' + tp.desc[LANG] + '</span>' +
      '</span>' +
    '</span>' +
    '<span class="pwrap">' +
      '<span class="pbar"><span class="pfill" style="width:' + pct + '%"></span></span>' +
      '<span class="plabel">' + best + ' / ' + tot + '</span>' +
    '</span>';
  b.addEventListener('click', () => { location.hash = 'q-' + tp.id; });
  return b;
}

function show(r) {
  track(r.s === 'quiz' ? 'quiz/' + r.topic.id : r.s === 'topics' ? 'level/' + r.level : r.s);
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[r.s].classList.add('active');
  backBtn.classList.toggle('show', r.s === 'topics' || r.s === 'quiz');
  nazarRow.classList.toggle('show', r.s === 'quiz');

  if (r.s === 'topics') { curLevel = r.level; renderTopics(r.level); }
  if (r.s === 'dict') { curLevel = r.level; renderDict(r.level); }
  document.querySelector('.shuffle-bar').style.display = (r.s === 'quiz' && r.topic.type === 'vocab') ? 'none' : '';
  if (r.s === 'quiz') {
    curLevel = r.topic.level;
    if (curTopic !== r.topic || !quizBuilt) { curTopic = r.topic; renderQuiz(false); }
  }

  if (r.s !== 'quiz') clearTimer();
  const hero = document.getElementById('hero');
  const bar = document.getElementById('barTitle');
  const brandHTML = 'Türkçe Quiz<span class="tr">.</span>';
  bar.innerHTML = brandHTML;

  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });
  ['a1', 'a2', 'b1'].forEach(lv => {
    const tps = TOPICS.filter(x => x.level === lv);

    tps.forEach(tp => { const n = topicTotal(tp); tot += n; got += Math.min(b[tp.id] || 0, n); });

    const el = document.getElementById(lv + 'prog');

function quizInProgress() {
  if (!curTopic) return false;
  if (curTopic.type === 'vocab') {
    return vState && vState.started && vState.stage !== 'done';
  }
  if (!sections.length) return false;
  const any = sections.some(s => s.answered > 0);
  const all = sections.every(s => s.answered === (s.cur ? s.cur.length : s.base.length));
  return any && !all;
}

const CONF_COLORS = ['#22418F', '#17A398', '#D64545', '#F2B705', '#7FD9D0'];
/* кольори салютів — турецький прапор: червоний + білий (+ золото для тепла) */
const FW_COLORS = ['#E30A17', '#FFFFFF', '#E30A17', '#FFFFFF', '#F2B705'];
function celebrate(n) {
  if (!n) return;
  const box = document.createElement('div');
  box.className = 'confetti-box';
  for (let i = 0; i < n; i++) {
    const p = document.createElement('span');
    p.className = 'confetti-piece';
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.background = CONF_COLORS[i % CONF_COLORS.length];
    p.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
    p.style.animationDelay = (Math.random() * 0.6) + 's';
    p.style.width = (7 + Math.random() * 7) + 'px';
    p.style.height = (10 + Math.random() * 8) + 'px';
    box.appendChild(p);
  }
  // салюти: кілька вибухів іскор у верхній частині екрана
  const bursts = n >= 240 ? 10 : n >= 160 ? 6 : 4;
  for (let f = 0; f < bursts; f++) {
    const cx = 12 + Math.random() * 76;
    const cy = 12 + Math.random() * 30;
    const color = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
    for (let s = 0; s < 16; s++) {
      const sp = document.createElement('span');
      sp.className = 'fw-spark';
      sp.style.left = cx + 'vw';
      sp.style.top = cy + 'vh';
      sp.style.background = color;
      const ang = (Math.PI * 2 * s) / 16 + Math.random() * 0.4;
      const dist = 55 + Math.random() * 75;
      sp.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      sp.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      sp.style.animationDelay = (0.25 + f * 0.45) + 's';
      box.appendChild(sp);
    }
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 4200);
}

function confettiFor(sc, n) { return sc === n ? 280 : sc >= n * 0.9 ? 180 : sc >= n * 0.6 ? 80 : 0; }

/* Ay-yıldız 🌙⭐ — частинки злітаються у півмісяць із зіркою (лише за 100%) */
function ayYildiz() {
  const box = document.createElement('div');
  box.className = 'confetti-box';
  const cx = 50, cy = 34; /* центр у vw/vh */
  const pts = [];
  /* півмісяць: зовнішнє коло мінус внутрішнє зміщене */
  for (let a = 0; a < Math.PI * 2; a += 0.16) {
    const R = 13;
    const x = cx + Math.cos(a) * R * 0.62, y = cy + Math.sin(a) * R;
    /* пропускаємо точки, що потрапляють у «виїмку» */
    const dx = (x - (cx + 3.6)) / 0.62, dy = y - cy;
    if (Math.sqrt(dx * dx + dy * dy) > 10.4) pts.push([x, y]);
  }
  /* внутрішній край серпа */
  for (let a = -1.25; a <= 1.25; a += 0.14) {
    const x = cx + 3.6 + Math.cos(a) * 10.4 * 0.62, y = cy + Math.sin(a) * 10.4;
    pts.push([x, y]);
  }
  /* п'ятикутна зірка праворуч від серпа */
  const sx = cx + 11.5, sy = cy;
  for (let i = 0; i < 10; i++) {
    const ang = -Math.PI / 2 + i * Math.PI / 5;
    const r = i % 2 === 0 ? 3.4 : 1.4;
    pts.push([sx + Math.cos(ang) * r * 0.62, sy + Math.sin(ang) * r]);
  }
  pts.forEach(([x, y], i) => {
    const p = document.createElement('span');
    p.className = 'ay-dot';
    p.style.left = x + 'vw';
    p.style.top = y + 'vh';
    p.style.animationDelay = (0.55 + Math.random() * 0.35) + 's';
    /* стартова позиція — розліт з випадкового боку */
    p.style.setProperty('--sx', (Math.random() * 100 - 50) + 'vw');
    p.style.setProperty('--sy', (40 + Math.random() * 60) + 'vh');
    box.appendChild(p);
  });
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 5200);
}

  if (list.length > 1 && i === lastPick[key]) i = (i + 1) % list.length;
  lastPick[key] = i;

}

    ]
  }
};
function tierPhrase(tier) {
  return pickFrom(PHRASES[tier][LANG] || PHRASES[tier].uk, tier);
}

function shuffle(arr) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function buildGramCard(gr) {
  const g = document.createElement('div');
  g.className = 'card gram';
  let inner = '<div class="gram-head">📖 ' + t('gramTitle') + '</div>';
  if (gr.html) {
    inner += gr.html[LANG] || gr.html.uk;
    g.innerHTML = inner;
    return g;
  }
  if (gr.intro) inner += '<p class="gram-text">' + (gr.intro[LANG] || gr.intro.uk) + '</p>';
  if (gr.formula) inner += '<span class="g-formula">' + (gr.formula[LANG] || gr.formula.uk || gr.formula) + '</span>';
  if (gr.sent) gr.sent.forEach(sx => {
    inner += '<p class="g-sent"><b>' + sx.t + '</b> — ' + (sx[LANG] || sx.uk) + '</p>';
  });
  if (gr.table) {
    const cell = c => typeof c === 'string' ? c : c[LANG];
    inner += '<div class="gram-scroll"><table class="gram-table">' +
      '<tr>' + gr.table.head[LANG].map(h => '<th>' + h + '</th>').join('') + '</tr>' +
      gr.table.rows.map(row => '<tr>' + row.map((c, i) =>
        '<td class="' + (i === 0 ? 'gt-name' : i === row.length - 1 ? 'gt-ex' : '') + '">' + cell(c) + '</td>'
      ).join('') + '</tr>').join('') +
    '</table></div>';
    inner += '<p class="gram-text gram-note">' + gr[LANG] + '</p>';
  } else {
    inner += '<p class="gram-text">' + gr[LANG] + '</p>' +
      '<ul class="gram-ex">' +
      gr.ex.map(e => '<li><b>' + e.t + '</b> — ' + e[LANG === 'ru' ? 'ru' : 'uk'] + '</li>').join('') +
      '</ul>';
  }
  g.innerHTML = inner;
  return g;
}

function buildSections(mixed) {
  const qs = curTopic.questions;
  if (mixed) return [{ title: t('mixTitle'), sub: t('mixSub'), base: shuffle(qs) }];
  if (!curTopic.multi) {
    return [{ title: curTopic.secTitle[LANG], sub: curTopic.secSub[LANG], base: qs.slice() }];
  }
  const secs = [];
  qs.forEach(q => {
    if (q.sec === "warmup") secs.push({ title: t('warmupTitle'), sub: t('warmupSub'), base: [] });
    if (q.sec === "vasita") secs.push({ title: t('vasitaTitle'), sub: t('vasitaSub'), gram: VASITA_GRAM, base: [] });
    if (q.sec === "main") secs.push({ title: t('mainTitle'), sub: t('mainSub'), base: [] });
    secs[secs.length - 1].base.push(q);
  });
  return secs;
}

function globalScore() { return sections.reduce((s, x) => s + x.correct, 0); }

function clearTimer() {
  if (timerInt) { clearInterval(timerInt); timerInt = null; }
  const chip = document.getElementById('timerChip');
  if (chip) chip.remove();
}
function fmtTime(s) {
  const m = Math.floor(s / 60), ss = s % 60;
  return m + ':' + (ss < 10 ? '0' : '') + ss;
}
function startTimer(seconds) {
  clearTimer();
  timeLeft = seconds;
  const chip = document.createElement('div');
  chip.className = 'timer-chip';
  chip.id = 'timerChip';
  chip.textContent = '⏱️ ' + fmtTime(timeLeft);
  document.body.appendChild(chip);
  timerInt = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) {
      chip.textContent = '⏱️ 0:00';
      clearInterval(timerInt); timerInt = null;
      timeOut();
      setTimeout(() => { const c = document.getElementById('timerChip'); if (c) c.remove(); }, 1600);
      return;
    }
    chip.textContent = '⏱️ ' + fmtTime(timeLeft);
    chip.classList.toggle('low', timeLeft <= 10);
  }, 1000);
}
function timeOut() {
  cardFinishers.forEach(f => f());
  sections.forEach(s => {
    if (s.answered === s.cur.length && s.showResult) s.showResult();
  });
  updatePill();
  checkAllDone();
}

function runTotal() {
  return sections.reduce((a, x) => a + (x.cur ? x.cur.length : x.base.length), 0);
}
function updatePill() {
  const pill = document.getElementById('scorePill');
  if (pill) pill.textContent = globalScore() + ' / ' + runTotal() + (streak >= 3 ? ' · 🔥' + streak : '');
  const fill = document.getElementById('quizFill');
  if (fill) {
    const answered = sections.reduce((a, s) => a + (s.answered || 0), 0);
    fill.style.width = Math.round(answered / runTotal() * 100) + '%';
  }
}
function checkAllDone() {
  const allDone = sections.every(s => s.answered === (s.cur ? s.cur.length : s.base.length));
  if (allDone) {
    if (timerInt) {
      const spare = timeLeft;
      clearTimer();
      const doneChip = document.createElement('div');
      doneChip.className = 'timer-chip';
      doneChip.id = 'timerChip';
      doneChip.textContent = '🏁 +' + fmtTime(spare);
      document.body.appendChild(doneChip);
      setTimeout(() => { const c = document.getElementById('timerChip'); if (c) c.remove(); }, 3500);
    }
    const n = runTotal(), sc = globalScore();
    const fullRun = sections.every(s => !s.cur || s.cur.length === s.base.length);
    if (fullRun) saveBest(curTopic.id, sc);
    if (sections.length < 2) { finishEl.classList.remove('show'); return; }
    document.getElementById('finalScore').textContent = sc + ' / ' + n;
    const base = sc === n ? perfectPraise() : sc >= n * 0.9 ? tierPhrase('harika') : sc >= n * 0.6 ? tierPhrase('iyi') : tierPhrase('train');
    document.getElementById('finalText').textContent =
      curTopic.finishMsg ? curTopic.finishMsg[LANG] + ' ' + (sc === n ? base : '') : base;
    celebrate(curTopic.finishMsg ? Math.max(confettiFor(sc, n), 160) : confettiFor(sc, n));
    if (sc === n) ayYildiz();
    quizMount.appendChild(finishEl); /* фінал стає під своєю темою навіть у стрічці */
    const fsBtn = document.getElementById('finishShare');
    fsBtn.onclick = () => shareResult(sc, n, curTopic.name[LANG]);
    const fn = document.getElementById('finishNext');
    fn.innerHTML = '';
    afterTopicDone(fn);
    finishEl.classList.add('show');
  } else {
    finishEl.classList.remove('show');
  }
}
function sectionVerdict(sc, n) {
  if (sc === n) return perfectPraise();
  return sc >= n * 0.9 ? tierPhrase('harika') : sc >= n * 0.6 ? tierPhrase('iyi') : tierPhrase('train');
}

function renderSection(s, items) {
  const topicRef = curTopic; /* тема, якій належить ця вправа */
  s.correct = 0; s.answered = 0;
  s.cur = items;
  s.wrong = [];
  for (let k = s.start; k < s.start + s.base.length; k++) dots[k].classList.remove('ok', 'bad');
  updatePill();
  checkAllDone();

  const box = document.createElement('div');
  if (s.el) s.el.replaceWith(box); else quizMount.appendChild(box);
  s.el = box;

  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = '<h2>' + s.title + '</h2><p>' + s.sub + '</p>';
  box.appendChild(head);

  if (s.gram) box.appendChild(buildGramCard(s.gram));

  items.forEach((q, k) => {
    const qi = s.start + k;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<p class="tag"></p>' +
      '<p class="sentence"><span class="num">' + (k + 1) + '.</span> ' + q.pre + '<b>___</b>' + q.post +
        ' <button class="speak" aria-label="🔊" title="' + t('speakTitle') + '">🔊</button></p>' +
      '<div class="opts">' + shuffle(q.opts.map((_, i) => i)).map(oi => '<button data-o="' + oi + '">' + q.opts[oi] + '</button>').join('') + '</div>' +
      '<p class="fb"></p>' +
      '<p class="tr-line">→ ' + q.tr[LANG] + '</p>';
    box.appendChild(card);

    const fb = card.querySelector('.fb');
    const trl = card.querySelector('.tr-line');
    const buttons = card.querySelectorAll('.opts button');

    const speakBtn = card.querySelector('.speak');
    speakBtn.addEventListener('click', () => {
      if (!ttsOk) return;
      const done = card.dataset.done;
      const text = done ? q.pre + q.opts[q.a].replace('-', '') + q.post : q.pre + ', ' + q.post.trim();
      const slow = window.speechSynthesis.speaking && lastSpeakBtn === speakBtn;
      lastSpeakBtn = speakBtn;
      speak(text, slow ? 0.6 : 0.95);
    });

    cardFinishers.push(() => {
      if (card.dataset.done) return;
      card.dataset.done = "1";
      s.answered++;
      streak = 0;
      s.wrong.push(q);
      bumpWordsIn(q.pre + ' ' + q.post, false);
      buttons.forEach(b => {
        b.disabled = true;
        if (+b.dataset.o === q.a) b.classList.add('ok');
      });
      const tg = card.querySelector('.tag');
      tg.textContent = q.cs ? CASE[q.cs][LANG] : curTopic.tag[LANG];
      tg.classList.add('show');
      const bl = card.querySelector('.sentence b');
      bl.textContent = q.opts[q.a].replace('-', '');
      bl.classList.add('filled');
      fb.textContent = t('timeUp') + ' ⏱️ ' + q.ok[LANG];
      fb.classList.add('show', 'wrong');
      trl.classList.add('show');
      dots[qi].classList.add('bad');
    });

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (card.dataset.done) return;
        card.dataset.done = "1";
        s.answered++;
        const isOk = +btn.dataset.o === q.a;
        if (isOk) { s.correct++; streak++; } else { streak = 0; s.wrong.push(q); }
        bumpWordsIn(q.pre + ' ' + q.post, isOk);

        buttons.forEach(b => {
          b.disabled = true;
          if (+b.dataset.o === q.a) b.classList.add('ok');
          else if (b === btn) b.classList.add('bad');
        });

        const tag = card.querySelector('.tag');
        tag.textContent = q.cs ? CASE[q.cs][LANG] : curTopic.tag[LANG];
        tag.classList.add('show');

        const blank = card.querySelector('.sentence b');
        blank.textContent = q.opts[q.a].replace('-', '');
        blank.classList.add('filled');

        fb.textContent = (isOk ? 'Doğru! ' : 'Maalesef. ') + q.ok[LANG];
        fb.classList.add('show', isOk ? 'good' : 'wrong');
        trl.classList.add('show');

        dots[qi].classList.add(isOk ? 'ok' : 'bad');
        updatePill();

        if (s.answered === s.cur.length) s.showResult();
      });
    });
  });

  const result = document.createElement('div');
  result.className = 'sec-result';
  result.innerHTML =
    '<div class="sec-score"></div>' +
    '<p class="sec-text"></p>' +
    '<div class="sec-btns">' +
      '<button class="btn-restart sec-again">' + t('again') + '</button>' +
      '<button class="btn-shuffle sec-mist" style="display:none"></button>' +
      '<button class="btn-shuffle sec-share">' + t('shareBtn') + '</button>' +
    '</div>';
  box.appendChild(result);

  result.querySelector('.sec-again').addEventListener('click', () => {
    if (curTopic !== topicRef) { restartTopic(topicRef); return; } /* стрічка поїхала далі — вертаємось до теми з нуля */
    clearTimer();
    renderSection(s, s.base);
    if (s.el.scrollIntoView) s.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  result.querySelector('.sec-share').addEventListener('click', () => {
    shareResult(s.correct, s.cur.length, curTopic.name[LANG]);
  });
  result.querySelector('.sec-mist').addEventListener('click', () => {
    if (curTopic !== topicRef) {
      const wrongQs = s.wrong.slice();
      const idx = s.idx || 0;
      restartTopic(topicRef);
      const ns = sections[idx];
      renderSection(ns, wrongQs);
      if (ns.el.scrollIntoView) ns.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    clearTimer();
    renderSection(s, s.wrong.slice());
    if (s.el.scrollIntoView) s.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });




  s.showResult = function () {
    if (result.classList.contains('show')) return;
    result.querySelector('.sec-score').textContent = s.title + ': ' + s.correct + ' / ' + s.cur.length;
    result.querySelector('.sec-text').textContent = sectionVerdict(s.correct, s.cur.length);
    const mBtn = result.querySelector('.sec-mist');
    if (s.wrong.length) {
      mBtn.style.display = 'inline-block';
      mBtn.textContent = t('mistakesBtn') + ' (' + s.wrong.length + ')';
    } else {
      mBtn.style.display = 'none';
    }
    result.classList.add('show');
    track('complete/' + curTopic.id, true);
    celebrate(confettiFor(s.correct, s.cur.length));
    if (s.correct === s.cur.length) ayYildiz();
    checkAllDone();
    if (sections.length < 2) afterTopicDone(result);
  };
}

function vocabMedia(item) {
  const box = document.createElement('div');
  box.className = 'vmedia';
  const img = document.createElement('img');
  img.alt = item.w;
  img.src = 'img/' + item.w.toLowerCase().replace('ç','c').replace('ö','o').replace('ü','u').replace('ğ','g').replace('ş','s').replace('ı','i') + '.jpg';
  img.addEventListener('error', () => {
    const em = document.createElement('div');
    em.className = 'vemoji';
    em.textContent = item.e;
    img.replaceWith(em);
  });
  box.appendChild(img);
  return box;
}

let vState = null;

function renderVocab() {
  document.getElementById('quizHead').innerHTML =
    '<p class="page-eyebrow">' + curTopic.level.toUpperCase() + '</p>' +
    '<h2>' + curTopic.name[LANG] + '</h2>';
  vState = { stage: 'learn', started: false };
  quizBuilt = true;
  streak = 0;
  clearTimer();
  cardFinishers = [];
  quizMount = quizEl;
  document.getElementById('quizMore').innerHTML = '';
  quizEl.innerHTML = '';
  finishEl.classList.remove('show');
  sections = [];
  const words = curTopic.words;
  total = words.length;

  nazarRow.innerHTML = Array.from({ length: total }, () => '<span class="nazar"></span>').join('')
    + '<span class="pbar quiz-pbar"><span class="pfill" id="quizFill" style="width:0%"></span></span>'
    + '<button class="mini-restart" id="quizRestart" title="' + t('restartHint') + '">↺</button>'
    + '<span class="score-pill" id="scorePill">0 / ' + total + '</span>';
  dots = nazarRow.querySelectorAll('.nazar');

  let idx = 0;
  const seen = new Set();

  function learnCard() {
    if (idx > 0) vState.started = true;
    seen.add(idx);
    quizEl.innerHTML = '';
    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = '<h2>' + t('vLearnTitle') + '</h2><p>' + t('vLearnSub') + '</p>';
    quizEl.appendChild(head);

    const item = words[idx];
    const card = document.createElement('div');
    card.className = 'card vcard';

    const nav = document.createElement('div');
    nav.className = 'vnav';
    words.forEach((_, k) => {
      const b = document.createElement('button');
      b.textContent = k + 1;
      if (seen.has(k)) b.classList.add('seen');
      if (k === idx) b.classList.add('cur');
      b.addEventListener('click', () => { idx = k; learnCard(); });
      nav.appendChild(b);
    });
    card.appendChild(nav);
    card.appendChild(vocabMedia(item));
    const w = document.createElement('div');
    w.className = 'vword';
    w.innerHTML = item.w + ' <button class="speak" aria-label="🔊" title="' + t('speakTitle') + '">🔊</button>';
    card.appendChild(w);
    const trn = document.createElement('p');
    trn.className = 'vtrans';
    trn.textContent = (item.tr[LANG] || item.tr.uk);
    card.appendChild(trn);
    const next = document.createElement('button');
    next.className = 'btn-restart';
    next.textContent = idx === total - 1 ? t('vStart') : t('vNext');
    card.appendChild(next);
    quizEl.appendChild(card);

    w.querySelector('.speak').addEventListener('click', () => {
      const slow = ttsOk && window.speechSynthesis.speaking;
      speak(item.w, slow ? 0.6 : 0.9);
    });
    if (ttsOk) speak(item.w, 0.9);

    next.addEventListener('click', () => {
      idx++;
      if (idx < total) learnCard(); else startTest();
    });
  }

  let order = [], ti = 0, correct = 0;

  let wrongWords = [];
  function startTest(list) {
    vState.stage = 'test'; vState.started = true;
    order = shuffle(list || words);
    wrongWords = [];
    ti = 0; correct = 0;
    dots.forEach((dd, k) => { dd.classList.remove('ok', 'bad'); dd.style.display = k < order.length ? '' : 'none'; });
    updateVPill();
    testCard();
  }
  function updateVPill() {
    const pill = document.getElementById('scorePill');
    if (pill) pill.textContent = correct + ' / ' + order.length + (streak >= 3 ? ' · 🔥' + streak : '');
    const fill = document.getElementById('quizFill');
    if (fill) {
      const answered = correct + wrongWords.length;
      fill.style.width = Math.round(answered / order.length * 100) + '%';
    }
  }

  function testCard() {
    quizEl.innerHTML = '';
    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = '<h2>' + t('vTestTitle') + '</h2><p>' + t('vTestSub') + '</p>';
    quizEl.appendChild(head);

    const item = order[ti];
    const card = document.createElement('div');
    card.className = 'card vcard';
    card.innerHTML = '<p class="vcount">' + (ti + 1) + ' / ' + total + '</p>';
    card.appendChild(vocabMedia(item));
    const hint = document.createElement('p');
    hint.className = 'vtrans vhint';
    hint.textContent = (item.tr[LANG] || item.tr.uk);
    card.appendChild(hint);

    const distractors = shuffle(words.filter(x => x.w !== item.w)).slice(0, 3);
    const opts = shuffle([item].concat(distractors));
    const grid = document.createElement('div');
    grid.className = 'opts vopts';
    opts.forEach(o => {
      const b = document.createElement('button');
      b.textContent = o.w;
      b.addEventListener('click', () => {
        if (card.dataset.done) return;
        card.dataset.done = "1";
        const isOk = o.w === item.w;
        if (isOk) { correct++; streak++; } else { streak = 0; wrongWords.push(item); }
        bumpWord(item.w, isOk);
        grid.querySelectorAll('button').forEach(x => {
          x.disabled = true;
          if (x.textContent === item.w) x.classList.add('ok');
          else if (x === b) x.classList.add('bad');
        });
        fb.textContent = (isOk ? 'Doğru! ' : 'Maalesef. ') + item.w + ' — ' + (item.tr[LANG] || item.tr.uk);
        fb.classList.add('show', isOk ? 'good' : 'wrong');
        dots[ti].classList.add(isOk ? 'ok' : 'bad');
        updateVPill();
        if (ttsOk) speak(item.w, 0.9);
        next.style.display = 'inline-block';
      });
      grid.appendChild(b);
    });
    card.appendChild(grid);

    const fb = document.createElement('p');
    fb.className = 'fb';
    card.appendChild(fb);

    const next = document.createElement('button');
    next.className = 'btn-restart';
    next.style.display = 'none';
    next.style.marginTop = '16px';
    next.textContent = t('vNext');
    next.addEventListener('click', () => {
      ti++;
      if (ti < total) testCard(); else vocabResult();
    });
    card.appendChild(next);
    quizEl.appendChild(card);
  }

  function vocabResult() {
    vState.stage = 'done';
    if (order.length === words.length && !curTopic.dynamic) saveBest(curTopic.id, correct);
    quizEl.innerHTML = '';
    const res = document.createElement('div');
    res.className = 'sec-result show';
    const mist = wrongWords.length
      ? '<button class="btn-shuffle v-mist">' + t('mistakesBtn') + ' (' + wrongWords.length + ')</button>' : '';
    const backHash = curTopic.backTo || curTopic.level;
    const backLabel = backHash.indexOf('d-') === 0 ? t('toDict') : t('toTopics');
    res.innerHTML =
      '<div class="sec-score">' + t('vResult') + ': ' + correct + ' / ' + order.length + '</div>' +
      '<p class="sec-text">' + sectionVerdict(correct, order.length) + '</p>' +
      '<div class="sec-btns"><button class="btn-restart v-again">' + t('again') + '</button>' + mist +
      '<button class="btn-shuffle v-share">' + t('shareBtn') + '</button>' +
      '<button class="btn-shuffle v-back">' + backLabel + '</button></div>';
    res.querySelector('.v-share').addEventListener('click', () => {
      shareResult(correct, order.length, curTopic.name[LANG]);
    });
    res.querySelector('.v-back').addEventListener('click', () => { location.hash = backHash; });
    const topicRef = curTopic;
    res.querySelector('.v-again').addEventListener('click', () => {
      if (curTopic !== topicRef) { restartTopic(topicRef); return; }
      renderVocab();
    });
    afterTopicDone(res);
    if (wrongWords.length) {
      res.querySelector('.v-mist').addEventListener('click', () => {
        if (curTopic !== topicRef) { restartTopic(topicRef); return; }
        startTest(wrongWords.slice());
      });
    }
    quizEl.appendChild(res);
    track('complete/' + curTopic.id, true);
    celebrate(confettiFor(correct, order.length));
    if (correct === order.length) ayYildiz();
  }

  learnCard();
}

let lastMode = { mixed: false, timed: false };

function renderQuiz(mixed, timed, append) {
  if (curTopic.type === 'vocab') { renderVocab(); return; }
  lastMode = { mixed: !!mixed, timed: !!timed };
  document.getElementById('quizHead').innerHTML =
    '<p class="page-eyebrow">' + curTopic.level.toUpperCase() + '</p>' +
    '<h2>' + curTopic.name[LANG] + '</h2>';
  quizBuilt = true;
  streak = 0;
  clearTimer();
  cardFinishers = [];

  const more = document.getElementById('quizMore');
  if (append) {
    /* режим стрічки: старий контент лишається, нова тема виростає знизу */
    quizMount = more;
    const dv = document.createElement('div');
    dv.className = 'topic-divider';
    dv.innerHTML = '<p class="page-eyebrow">▶ ' + t('nextTopic') + '</p>' +
      '<h2>' + (curTopic.icon || '📘') + ' ' + curTopic.name[LANG] + '</h2>';
    more.appendChild(dv);
  } else {
    quizMount = quizEl;
    quizEl.innerHTML = '';
    more.innerHTML = '';
  }
  finishEl.classList.remove('show');

  sections = buildSections(mixed);
  let gi = 0;
  sections.forEach(s => { s.start = gi; gi += s.base.length; s.el = null; });
  total = gi;

  nazarRow.innerHTML = Array.from({ length: total }, () => '<span class="nazar"></span>').join('')
    + '<span class="pbar quiz-pbar"><span class="pfill" id="quizFill" style="width:0%"></span></span>'
    + '<button class="mini-restart" id="quizRestart" title="' + t('restartHint') + '">↺</button>'
    + '<span class="score-pill" id="scorePill">0 / ' + total + '</span>';
  dots = nazarRow.querySelectorAll('.nazar');

  if (curTopic.grammar && !timed) {
    quizMount.appendChild(buildGramCard(curTopic.grammar));
  }

  sections.forEach((s, i) => { s.idx = i; });
  sections.forEach(s => renderSection(s, s.base));

  if (timed) {
    startTimer(runTotal() * 12);
    track('timed/' + curTopic.id, true);
  }
}

function askConfirm(title, text, yesTxt, noTxt, onYes) {
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML =
    '<div class="modal">' +
      '<div class="m-title">' + title + '</div>' +
      '<p class="m-text">' + text + '</p>' +
      '<div class="m-btns">' +
        '<button class="btn-restart m-yes">' + yesTxt + '</button>' +
        '<button class="btn-shuffle m-no">' + noTxt + '</button>' +
      '</div>' +
    '</div>';
  back.querySelector('.m-no').addEventListener('click', () => back.remove());
  back.querySelector('.m-yes').addEventListener('click', () => { back.remove(); onYes(); });
  back.addEventListener('click', e => { if (e.target === back) back.remove(); });
  document.body.appendChild(back);
}

function doQuizRestart() {
  if (curTopic.type === 'vocab') renderVocab();
  else renderQuiz(lastMode.mixed, lastMode.timed);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

nazarRow.addEventListener('click', e => {
  if (e.target.id !== 'quizRestart') return;
  if (quizInProgress()) {
    askConfirm(t('restartAskTitle'), t('restartAskText'), t('restartYes'), t('restartNo'), doQuizRestart);
  } else {
    doQuizRestart();
  }
});

document.getElementById('restart').addEventListener('click', () => {
  renderQuiz(false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
document.getElementById('finishMix').addEventListener('click', () => {
  renderQuiz(true);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
document.getElementById('globalMix').addEventListener('click', () => {
  renderQuiz(true);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
document.getElementById('timedBtn').addEventListener('click', () => {
  renderQuiz(true, true);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ------------------ PWA ------------------ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

document.querySelectorAll('.side img, .mobile-strip img').forEach(im => {
  im.addEventListener('error', () => im.classList.add('off'));
});

let lastY = 0;
const topbarWrap = document.querySelector('.topbar-wrap');
window.addEventListener('scroll', () => {
  const y = window.scrollY || 0;
  if (y > lastY + 8 && y > 70) topbarWrap.classList.add('slim');
  else if (y < lastY - 8 || y <= 70) topbarWrap.classList.remove('slim');
  lastY = y;
}, { passive: true });

/* Фолбек hero-фото: спрацьовує, лише якщо блок розкоментовано вище */
const heroImg = document.getElementById('heroImg');
if (heroImg) heroImg.addEventListener('error', () => {
  document.getElementById('heroMedia').classList.add('off');
});

/* ------------------ старт ------------------ */
show(route());
</script>
</body>
</html>
