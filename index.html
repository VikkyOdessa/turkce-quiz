    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background: var(--cobalt-deep);

  .nazar.bad { border-color: var(--tulip); transform: scale(1.15); }

    margin-left: auto;
    font-weight: 700;

    background: var(--turquoise-soft);

    border-radius: 6px;

    60% { transform: scale(1.15); }

  .btn-shuffle {

function shuffle(arr) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

    return [{
      title: 'Впереміш',
      sub: 'Усі питання у випадковому порядку — падеж треба визначити з контексту. Оновлення сторінки повертає звичайний порядок.',
      base: shuffle(QUESTIONS)
    }];
  }
  const secs = [];
  QUESTIONS.forEach(q => {
    if (q.section) secs.push({ title: q.section, sub: q.sectionSub, base: [] });
    secs[secs.length - 1].base.push(q);
  });
  return secs;
}

function globalScore() {
  return sections.reduce((s, x) => s + x.correct, 0);
}

function updatePill() {
  const pill = document.getElementById('scorePill');
  if (pill) pill.textContent = globalScore() + ' / ' + total;
}

function checkAllDone() {
  const allDone = sections.every(s => s.answered === s.base.length);
  if (allDone) {
    const n = total, sc = globalScore();
    document.getElementById('finalScore').textContent = sc + ' / ' + n;
    document.getElementById('finalText').textContent =
      sc >= n * 0.9 ? 'Harika! Чудовий результат — падежі майже підкорені.'
      : sc >= n * 0.6 ? 'İyi! Непогано — переглянь пояснення до помилок вище.'
      : 'Варто ще потренуватись — усі пояснення до помилок вище.';
    finishEl.classList.add('show');
  } else {
    finishEl.classList.remove('show');
  }
}

function sectionVerdict(sc, n) {
  return sc >= n * 0.9 ? 'Harika! Майже без помилок.'
    : sc >= n * 0.6 ? 'İyi! Непогано, але глянь пояснення до помилок.'
    : 'Варто повторити цю вправу ще раз.';
}

function renderSection(s, si, items) {
  s.correct = 0;
  s.answered = 0;
  for (let k = s.start; k < s.start + s.base.length; k++) dots[k].classList.remove('ok', 'bad');
  updatePill();
  checkAllDone();

  const box = document.createElement('div');
  if (s.el) s.el.replaceWith(box); else quizEl.appendChild(box);
  s.el = box;

  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = '<h2>' + s.title + '</h2><p>' + s.sub + '</p>';
  box.appendChild(head);

  items.forEach((q, k) => {
    const qi = s.start + k;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<p class="tag"></p>' +
      '<p class="sentence"><span class="num">' + (qi + 1) + '.</span> ' + q.pre + '<b>___</b>' + q.post + '</p>' +
      '<div class="opts">' + q.opts.map((o, i) => '<button data-i="' + i + '">' + o + '</button>').join('') + '</div>' +
      '<p class="fb"></p>' +
      '<p class="tr-line">→ ' + q.tr + '</p>';
    box.appendChild(card);

    const fb = card.querySelector('.fb');
    const trl = card.querySelector('.tr-line');
    const buttons = card.querySelectorAll('.opts button');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (card.dataset.done) return;
        card.dataset.done = "1";
        s.answered++;
        const isOk = +btn.dataset.i === q.a;
        if (isOk) s.correct++;

        buttons.forEach(b => {
          b.disabled = true;
          if (+b.dataset.i === q.a) b.classList.add('ok');
          else if (b === btn) b.classList.add('bad');
        });

        const tag = card.querySelector('.tag');
        tag.textContent = q.tag;
        tag.classList.add('show');

        const blank = card.querySelector('.sentence b');
        blank.textContent = q.opts[q.a].replace('-', '');
        blank.classList.add('filled');

        fb.textContent = (isOk ? 'Doğru! ' : 'Maalesef. ') + q.ok;
        fb.classList.add('show', isOk ? 'good' : 'wrong');
        trl.classList.add('show');

        dots[qi].classList.add(isOk ? 'ok' : 'bad');
        updatePill();

        if (s.answered === s.base.length) {
          result.querySelector('.sec-score').textContent = s.title + ': ' + s.correct + ' / ' + s.base.length;
          result.querySelector('.sec-text').textContent = sectionVerdict(s.correct, s.base.length);
          result.classList.add('show');
          checkAllDone();
        }
      });
    });
  });

  const result = document.createElement('div');
  result.className = 'sec-result';
  result.innerHTML =
    '<div class="sec-score"></div>' +
    '<p class="sec-text"></p>' +
    '<div class="sec-btns">' +
      '<button class="btn-restart sec-again">🔄 Почати знову</button>' +
      '<button class="btn-shuffle sec-mix">🔀 Перемішати</button>' +
    '</div>';
  box.appendChild(result);

  result.querySelector('.sec-again').addEventListener('click', () => {
    renderSection(s, si, s.base);
    s.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  result.querySelector('.sec-mix').addEventListener('click', () => {
    renderSection(s, si, shuffle(s.base));
    s.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

function render(mixed) {
  quizEl.innerHTML = '';
  finishEl.classList.remove('show');

  sections = buildSections(mixed);
  let gi = 0;
  sections.forEach(s => { s.start = gi; gi += s.base.length; s.el = null; });
  total = gi;

  nazarRow.innerHTML = Array.from({ length: total }, () => '<span class="nazar"></span>').join('')
    + '<span class="score-pill" id="scorePill">0 / ' + total + '</span>';
  dots = nazarRow.querySelectorAll('.nazar');

  sections.forEach((s, si) => renderSection(s, si, s.base));
}

document.getElementById('restart').addEventListener('click', () => {
  render(false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.querySelectorAll('.btn-shuffle:not(.sec-mix)').forEach(b => b.addEventListener('click', () => {
  render(true);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}));

render(false);
</script>
</body>
</html>
