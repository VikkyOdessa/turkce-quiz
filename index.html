<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Türkçe Quiz</title>
<meta name="description" content="Інтерактивні квізи з турецької мови · Интерактивные квизы по турецкому языку">
<meta name="theme-color" content="#FAF9F4">
<!-- Картка попереднього перегляду при шерингу лінка (Telegram, WhatsApp, Viber) -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://vikkyodessa.github.io/turkce-quiz/">
<meta property="og:title" content="Türkçe Quiz — вивчай турецьку граючись 🧿">
<meta property="og:description" content="Безкоштовні інтерактивні вправи A1–B1: відмінки, часи, розумний словник, режим на швидкість. Без реєстрації, працює з телефона.">
<meta property="og:image" content="https://vikkyodessa.github.io/turkce-quiz/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script data-goatcounter="https://turkce-quiz.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
</head>
<body>

<aside class="side side-left" aria-hidden="true">
  <img src="img/side-left.jpg" alt="">
  <img src="img/side-left2.jpg" alt="">
</aside>
<aside class="side side-right" aria-hidden="true">
  <img src="img/side-right.jpg" alt="">
  <img src="img/side-right2.jpg" alt="">
</aside>

<div class="topbar-wrap">
  <div class="wrap topbar">
    <button class="back" id="backBtn">←</button>
    <div class="brand" id="barTitle">Türkçe Quiz<span class="tr">.</span></div>
    <button class="nav-toggle" id="navBtn" aria-label="Мапа курсу">☰</button>
    <div class="langs" id="langBar">
      <button data-lang="uk">UA</button>
      <!-- РОСІЙСЬКА ТИМЧАСОВО ВИМКНЕНА. Щоб увімкнути назад — розкоментуй:
      <button data-lang="ru">RU</button>
      -->
    </div>
  </div>
  <div class="wrap nazar-strip">
    <div class="nazar-row" id="nazarRow" aria-hidden="true"></div>
  </div>
</div>

<header class="hero" id="hero">
  <div class="wrap hero-grid">
    <div class="hero-text">
      <p class="eyebrow">Türkçe öğreniyorum</p>
      <h1>Türkçe Quiz<span class="tr">.</span></h1>
      <p class="sub" id="hSub"></p>
    </div>
    <div class="mobile-strip" aria-hidden="true">
      <img src="img/side-left.jpg" alt="">
      <img src="img/side-right.jpg" alt="">
      <img src="img/side-left2.jpg" alt="">
      <img src="img/side-right2.jpg" alt="">
    </div>
    <!-- ВЕЛИКЕ ФОТО НА ГОЛОВНІЙ (вимкнено).
         Щоб повернути: прибери цей коментар і завантаж img/hero.jpg у репозиторій.
    <div class="hero-media" id="heroMedia">
      <img src="img/hero.jpg" alt="Türkiye" id="heroImg">
      <span class="hero-badge">🧿</span>
    </div>
    -->
  </div>
</header>

<main>
  <div class="wrap">

    <div class="screen" id="screen-lang">
      <div class="choice-grid">
        <button class="choice" data-pick="uk">
          <span class="c-title">Українська</span>
          <span class="c-desc">Вчу турецьку через українську</span>
        </button>
        <!-- РОСІЙСЬКА ТИМЧАСОВО ВИМКНЕНА (розкоментуй, щоб повернути):
        <button class="choice" data-pick="ru">
          <span class="c-title">Русский</span>
          <span class="c-desc">Учу турецкий через русский</span>
        </button>
        -->
        <button class="choice disabled" tabindex="-1">
          <span class="c-title">English <span class="c-badge soon">soon</span></span>
          <span class="c-desc">Learn Turkish through English</span>
        </button>
      </div>
    </div>

    <div class="screen" id="screen-home">
      <div class="choice-grid">
        <button class="choice level-a1" data-level="a1">
          <span class="c-title">A1 <span class="c-badge" id="a1badge"></span></span>
          <span class="c-desc" data-i="a1desc"></span>
          <span class="pwrap" id="a1prog"></span>
        </button>
        <button class="choice" data-level="a2">
          <span class="c-title">A2 <span class="c-badge" id="a2badge"></span></span>
          <span class="c-desc" data-i="a2desc"></span>
          <span class="pwrap" id="a2prog"></span>
        </button>
        <button class="choice" data-level="b1">
          <span class="c-title">B1 <span class="c-badge" id="b1badge"></span></span>
          <span class="c-desc" data-i="b1desc"></span>
          <span class="pwrap" id="b1prog"></span>
        </button>
      </div>
    </div>

    <div class="screen" id="screen-topics">
      <div class="page-head" id="topicsHead"></div>
      <div class="choice-grid" id="topicGrid"></div>
    </div>

    <div class="screen" id="screen-dict">
      <div class="page-head" id="dictHead"></div>
      <div class="dict-bar">
        <input type="search" id="dictSearch" class="dict-search">
        <button class="btn-restart" id="trainBtn"></button>
      </div>
      <div id="dictList"></div>
      <div class="section-head" id="dictExHead"></div>
      <div class="choice-grid" id="dictTopics"></div>
      <div class="shuffle-bar" id="dictNext"></div>
    </div>

    <div class="screen" id="screen-quiz">
      <button class="lvl-pill quiz-pill" id="quizPill"></button>
      <div class="page-head" id="quizHead"></div>
      <div id="quiz"></div>
      <div class="finish" id="finish">
        <div class="big" id="finalScore"></div>
        <p id="finalText"></p>
        <button class="btn-restart" id="restart"></button>
        <button class="btn-shuffle" id="finishMix"></button>
        <button class="btn-shuffle" id="finishShare"></button>
        <div id="finishNext"></div>
      </div>
      <div id="quizMore"></div>
      <div class="shuffle-bar">
        <button class="btn-shuffle" id="globalMix"></button>
        <button class="btn-shuffle" id="timedBtn"></button>
      </div>
    </div>

  </div>
</main>

<footer>
  <div class="wrap">Kolay gelsin! 🧿 <span class="ver" id="verTag"></span></div>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
